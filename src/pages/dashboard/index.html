<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalShare - Desktop Dashboard</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-layout">
      <!-- Sidebar Navigation -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="brand-badge">
            <img src="../../../icon.png" alt="LocalShare Logo" class="brand-icon" />
            <div class="brand-text">
              <span class="brand-name">LocalShare</span>
              <span class="brand-tag">v1.0</span>
            </div>
          </div>
        </div>

        <nav class="sidebar-menu">
          <button class="nav-item active" data-view="files">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>Files & Sharing</span>
            <span class="nav-badge" id="navFilesBadge">0</span>
          </button>

          <button class="nav-item" data-view="connect">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Connect & QR</span>
          </button>

          <button class="nav-item" data-view="devices">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
              <line x1="12" y1="18" x2="12.01" y2="18"></line>
            </svg>
            <span>Your devices</span>
            <span class="nav-badge" id="navDevicesBadge">0</span>
          </button>

          <button class="nav-item" data-view="api">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            <span>API Explorer</span>
          </button>

          <button class="nav-item" data-view="settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>Settings</span>
          </button>

          <button class="nav-item" data-view="about">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <span>About</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="server-status-card" id="sidebarServerCard" title="Click to copy server URL">
            <div class="status-indicator-wrap">
              <span class="status-dot"></span>
              <span class="status-label" id="sidebarServerStatus">Active :5199</span>
            </div>
            <span class="status-ip" id="sidebarServerIp">127.0.0.1</span>
          </div>

          <button class="btn btn-secondary w-full" id="sidebarOpenBrowserBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            <span>Open Browser</span>
          </button>
        </div>
      </aside>

      <!-- Main Content Pane -->
      <div class="content-wrapper">
        <!-- Top Context Header -->
        <header class="top-header">
          <h2 class="view-title" id="viewTitle">Files & Sharing</h2>

          <div class="top-actions">
            <div class="server-pill" id="serverPill" title="Click to copy server URL">
              <span class="pulse-indicator"></span>
              <span class="server-status-text" id="serverStatusText">Connecting...</span>
              <button class="pill-copy-btn" id="pillCopyBtn" title="Copy server URL">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
              </button>
            </div>
          </div>
        </header>

        <!-- Dynamic Views Area -->
        <main class="views-container" id="viewsContainer">
          <!-- Views loaded dynamically from views/ -->
          <div data-view-include="views/files.html"></div>
          <div data-view-include="views/connect.html"></div>
          <div data-view-include="views/devices.html"></div>
          <div data-view-include="views/api.html"></div>
          <div data-view-include="views/settings.html"></div>
          <div data-view-include="views/about.html"></div>
        </main>
      </div>

      <!-- Global Notification Toast -->
      <div class="toast" id="toast">
        <span class="toast-icon">✓</span>
        <span class="toast-message" id="toastMessage">Action completed</span>
      </div>
    </div>

    <!-- Modals Container -->
    <div id="modalsContainer">
      <div data-view-include="views/modals/add-device.html"></div>
      <div data-view-include="views/modals/json-spec.html"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
