<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalShare Settings</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <img src="../../../public/icon.png" alt="LocalShare" class="logo" />
        <h1>LocalShare Settings</h1>
      </header>

      <main>
        <form id="settingsForm">
          <div class="setting-group">
            <h2>General</h2>

            <div class="setting-item">
              <div class="setting-content">
                <span class="setting-label">Start with Windows</span>
                <span class="setting-description"
                  >Launch LocalShare when your computer starts</span
                >
              </div>
              <label for="autostart" class="toggle-switch">
                <input type="checkbox" id="autostart" name="autostart" />
                <span class="toggle-slider"></span>
              </label>
            </div>

            <div class="setting-item">
              <div class="setting-content">
                <span class="setting-label">Open dashboard at start</span>
                <span class="setting-description"
                  >Show dashboard window when LocalShare starts</span
                >
              </div>
              <label for="openDashboardAtStart" class="toggle-switch">
                <input
                  type="checkbox"
                  id="openDashboardAtStart"
                  name="openDashboardAtStart"
                />
                <span class="toggle-slider"></span>
              </label>
            </div>

            <div class="setting-item">
              <div class="setting-content">
                <span class="setting-label">Show notifications</span>
                <span class="setting-description"
                  >Display notifications when files are shared</span
                >
              </div>
              <label for="notifications" class="toggle-switch">
                <input
                  type="checkbox"
                  id="notifications"
                  name="notifications"
                />
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>

          <div class="setting-group">
            <h2>Server</h2>

            <div class="setting-item">
              <label for="port">
                <span class="setting-label">Port</span>
                <span class="setting-description"
                  >Web server port (default: 5199. If you change the port number
                  you have to manually adjust the port in the chrome extension
                  settings as well)</span
                >
              </label>
              <input
                type="number"
                id="port"
                name="port"
                min="1024"
                max="65535"
                placeholder="5199"
              />
            </div>
          </div>

          <div class="setting-group">
            <h2>Appearance</h2>

            <div class="setting-item">
              <label for="theme">
                <span class="setting-label">Theme</span>
                <span class="setting-description"
                  >Choose application theme</span
                >
              </label>
              <select id="theme" name="theme">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="system">Match system</option>
              </select>
            </div>
          </div>

          <div class="setting-group">
            <h2>Recent Files</h2>
            <div class="setting-item">
              <button type="button" id="clearHistory" class="secondary-button">
                Clear recent files history
              </button>
            </div>
          </div>

          <div class="setting-group">
            <h2>Actions</h2>
            <div class="setting-item">
              <button type="button" id="openLogs" class="secondary-button">
                Open logs
              </button>
            </div>
          </div>
        </form>
      </main>

      <footer>
        <button type="button" id="saveButton" class="primary-button">
          Save Settings
        </button>
        <button type="button" id="cancelButton" class="secondary-button">
          Cancel
        </button>
      </footer>

      <div id="notification" class="notification">
        <span id="notificationMessage"></span>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
